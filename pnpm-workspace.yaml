overrides:
  # Force every transitive esbuild up to a patched release — clears the
  # GHSA-67mh-4wv8-2f99 dev-server advisory. Still reached through Vite and
  # drizzle-kit's deprecated @esbuild-kit chain.
  esbuild: 0.25.12
  # Reached through the Tailwind/Vite toolchain. 8.5.18 clears the advisory and
  # is a patch bump within postcss 8 — no plugin API change.
  postcss: ^8.5.18
  #
  # Four overrides were dropped when SvelteKit left (issue #21, re-derived rather
  # than carried forward — dead overrides are how they become permanent):
  #   esrap            patched Svelte's codegen printer; no Svelte here now.
  #   cookie           lifted SvelteKit's cookie 0.6 pin (GHSA-pxg6-pf52-xh8x).
  #   tar              @vercel/nft > @mapbox/node-pre-gyp, via adapter-vercel.
  #   brace-expansion  the same @vercel/nft chain, via glob > minimatch.
  # If any advisory resurfaces under the new dependency tree, re-add it here with
  # the chain that reaches it, not because it used to be listed.

allowBuilds:
  # Still reached through drizzle-kit's toolchain, not by the app at runtime.
  better-sqlite3: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@fallow-cli/darwin-arm64@2.101.0'
  - '@fallow-cli/darwin-x64@2.101.0'
  - '@fallow-cli/linux-arm64-gnu@2.101.0'
  - '@fallow-cli/linux-arm64-musl@2.101.0'
  - '@fallow-cli/linux-x64-gnu@2.101.0'
  - '@fallow-cli/linux-x64-musl@2.101.0'
  - '@fallow-cli/win32-arm64-msvc@2.101.0'
  - '@fallow-cli/win32-x64-msvc@2.101.0'
  - fallow@2.101.0
  - '@typescript/native-preview-darwin-arm64@7.0.0-dev.20260622.1'
  - '@typescript/native-preview-darwin-x64@7.0.0-dev.20260622.1'
  - '@typescript/native-preview-linux-arm64@7.0.0-dev.20260622.1'
  - '@typescript/native-preview-linux-arm@7.0.0-dev.20260622.1'
  - '@typescript/native-preview-linux-x64@7.0.0-dev.20260622.1'
  - '@typescript/native-preview-win32-arm64@7.0.0-dev.20260622.1'
  - '@typescript/native-preview-win32-x64@7.0.0-dev.20260622.1'
  - '@typescript/native-preview@7.0.0-dev.20260622.1'
